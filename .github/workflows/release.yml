name: Release

# Builds every gem in the repo, attaches them to a GitHub release, and
# publishes to RubyGems via trusted publishing (OIDC — no stored API key).
# Requires a trusted publisher configured on rubygems.org for EACH gem
# name in this repo, pointing at this repository and this workflow file.
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: bundle exec rake build_all
      - uses: actions/upload-artifact@v4
        with:
          name: gems
          path: pkg/*.gem
      - name: Attach gems to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: pkg/*.gem
          generate_release_notes: true

  publish:
    # Tag pushes release; workflow_dispatch covers environments where tags
    # can't be pushed directly (gem push is idempotent-failing, so an
    # accidental re-run can't double-publish a version).
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC exchange with rubygems.org
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      # The action publishes no v1 tag; @main is the ref its docs pin.
      - uses: rubygems/configure-rubygems-credentials@main
      # Each gem is pushed only when RubyGems lacks its version, so a tag
      # pushed after a workflow_dispatch already published the release (or
      # a re-run) attaches the gems to the GitHub release and passes,
      # instead of failing on RubyGems' refusal to overwrite a version.
      - name: Publish the core, then the adapter that depends on it
        run: |
          publish() {
            name="$1"; gemspec="$2"
            gem build "$gemspec"
            gem_path=$(ls "$name"-[0-9]*.gem)
            version=$(basename "$gem_path" .gem | sed -E "s/^${name}-//")
            # `gem list --all` prints one line: `name (1.2.0, 1.1.0, ...)`,
            # so the version is matched between its delimiters.
            if gem list --remote --exact --all "$name" | tr -d ' ' |
                 grep -qE "[(,]${version//./\\.}[,)]"; then
              echo "$name $version is already on RubyGems; nothing to do."
            else
              gem push "$gem_path"
            fi
          }
          publish activeagents-telemetry activeagents-telemetry.gemspec
          cd adapters/ruby_llm
          publish activeagents-telemetry-ruby_llm activeagents-telemetry-ruby_llm.gemspec
